<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Sandbox</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #chat-box { height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 4px; }
        .system { background: #e0f7fa; color: #006064; font-size: 0.9em; }
        .user { background: #e8f5e9; color: #1b5e20; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        #status { font-weight: bold; margin-bottom: 10px; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
    <h2>WebSocket Sandbox Chat</h2>
    <div id="status" class="disconnected">Trạng thái: Đang kết nối...</div>
    
    <div id="chat-box"></div>
    
    <div class="input-group">
        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." disabled>
        <button id="send-btn" disabled>Gửi</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDiv = document.getElementById('status');

        function appendMessage(text, type = 'user') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- LÝ THUYẾT: Khởi tạo kết nối WebSocket ---
        // Sử dụng window.location.host để tự động lấy địa chỉ IP của máy chủ hiện tại
        // Việc này giúp bạn bè cùng chung mạng LAN có thể kết nối được
        // Tự động kiểm tra xem web đang chạy http hay https
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';

        // Khởi tạo WebSocket với giao thức tương ứng
        const ws = new WebSocket(protocol + window.location.host);

        // Sự kiện: Khi kết nối thành công (Handshake hoàn tất)
        ws.onopen = () => {
            statusDiv.textContent = 'Trạng thái: Đã kết nối (Connected)';
            statusDiv.className = 'connected';
            messageInput.disabled = false;
            sendBtn.disabled = false;
        };

        // Sự kiện: Khi nhận được tin nhắn từ server
        ws.onmessage = (event) => {
            try {
                // Parse chuỗi JSON thành object
                const data = JSON.parse(event.data);
                
                if (data.type === 'system') {
                    appendMessage(`Hệ thống: ${data.message}`, 'system');
                } else if (data.type === 'chat') {
                    appendMessage(`${data.sender}: ${data.content}`, 'user');
                }
            } catch (e) {
                // Nếu không phải JSON, in ra dạng text thuần
                appendMessage(`Khách: ${event.data}`, 'user');
            }
        };

        // Sự kiện: Khi kết nối bị đóng
        ws.onclose = () => {
            statusDiv.textContent = 'Trạng thái: Đã ngắt kết nối (Disconnected)';
            statusDiv.className = 'disconnected';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            appendMessage('Đã mất kết nối tới server.', 'system');
        };

        // Hàm xử lý gửi tin nhắn
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text && ws.readyState === WebSocket.OPEN) {
                // Đóng gói tin nhắn thành JSON
                const payload = {
                    type: 'chat',
                    sender: 'Tôi',
                    content: text
                };
                // Gửi dữ liệu qua WebSocket
                ws.send(JSON.stringify(payload));
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
