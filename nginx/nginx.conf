events {
    worker_connections 1024;
}

http {
    # Upstream cho FastAPI (Backend cũ)
    upstream python_backend {
        server backend:8001;
    }

    # Upstream cho Socket.IO (Realtime)
    upstream ws_server {
        server ws_server:3000;
    }

    # Upstream cho Spring Boot
    upstream spring_backend {
        server spring_backend:8080;
    }

    server {
        listen 8080;
        server_name localhost;

        # 1. Route cho WebSockets
        location /socket.io/ {
            proxy_pass http://ws_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Khu vực ghi đè (override) các API chuyển sang Spring Boot
        location ~ ^/api/v1/auth/(login|register) {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route mặc định cho tất cả các API hiện tại (FastAPI)
        location / {
            proxy_pass http://python_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
