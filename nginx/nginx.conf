events {
    worker_connections 1024;
}

http {
    # Upstream cho Socket.IO (Realtime)
    upstream ws_server {
        server ws_server:3000;
    }

    # Upstream cho Spring Boot
    upstream spring_backend {
        server spring_backend:8080;
    }

    # Legacy bridge: ưu tiên HttpOnly cookie do Spring phát hành, nhưng vẫn chấp nhận
    # Authorization header cũ nếu client chưa có cookie.
    map $cookie_accessToken $legacy_authorization {
        default $http_authorization;
        "~.+" "Bearer $cookie_accessToken";
    }

    server {
        listen 8080;
        server_name localhost;

        # 1. Route cho WebSockets
        location /socket.io/ {
            proxy_pass http://ws_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Authorization $legacy_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spring là owner duy nhất của toàn bộ auth vertical slice.
        location /api/v1/auth/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User/Profile vertical slice đã được Spring Boot tiếp quản.
        location = /api/v1/hobbies {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users/ {
            # 10MB file + multipart metadata.
            client_max_body_size 11m;
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Friends vertical slice đã được Spring Boot tiếp quản toàn bộ.
        # Chuyển cả request lifecycle và friendship cùng lúc để chỉ có một writer.
        location /api/v1/friend-requests {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/friends {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat/Messaging vertical slice đã do Spring Boot sở hữu. Attachment được
        # upload và tạo Message trong cùng một request để tránh file rác.
        location /api/v1/conversations {
            client_max_body_size 51m;
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Translation là một phần của Message vertical slice và được Spring
        # kiểm tra quyền truy cập theo participant trước khi gọi Gemini.
        location /api/v1/messages {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoint dịch text tùy ý cũ không còn được frontend sử dụng.
        location ^~ /api/v1/ai {
            return 410;
        }

        # Video Call vertical slice: Spring owns call state, authorization and
        # LiveKit token issuance. The browser only sends an opaque call_id.
        location /api/v1/calls {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Events and Games vertical slices are now served by Spring Boot.
        location /api/v1/events {
            client_max_body_size 11m;
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/games {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bundled event/avatar images and user uploads are now served by
        # Spring Boot. Keep these before the catch-all API route.
        location /static/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Retire legacy video endpoints which accepted arbitrary room names
        # and caller metadata from the browser.
        location ^~ /api/v1/video {
            return 410;
        }

        # 2. Route mặc định: Spring owns all HTTP backend routes.
        location / {
            proxy_pass http://spring_backend;
            proxy_set_header Authorization $legacy_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
