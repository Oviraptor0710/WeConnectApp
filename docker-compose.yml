# version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: weconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: weconnect_root_2024
      MYSQL_DATABASE: weconnect
      MYSQL_USER: weconnect_user
      MYSQL_PASSWORD: weconnect_pass_2024
    ports:
      - "3308:3308"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3308", "-u", "root", "-pweconnect_root_2024" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --port=3308 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    container_name: weconnect_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Spring là token issuer; legacy FastAPI chỉ verify bằng cùng key.
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  ws_server:
    build: ./ws-server
    container_name: weconnect_ws_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./ws-server:/app
      - /app/node_modules

  api_gateway:
    image: nginx:alpine
    container_name: weconnect_api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ws_server
      - spring_backend

  spring_backend:
    build: ./spring-backend
    container_name: weconnect_spring_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
