server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Mặc định là dev nếu không truyền biến môi trường
  datasource:
    url: jdbc:mysql://db:3308/weconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: weconnect_user
    password: weconnect_pass_2024
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# Cấu hình chung cho JWT (Áp dụng cho mọi môi trường)
app:
  # Spring và FastAPI cùng ghi/đọc named volume uploads_data trong Docker.
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  cors:
    # Production: đặt CORS_ALLOWED_ORIGINS thành danh sách domain frontend, phân cách bằng dấu phẩy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081}
  jwt:
    # Không có fallback: service phải fail-fast nếu thiếu secret dùng chung.
    secret: ${SECRET_KEY}
    issuer: weconnect-auth
    access-expiration-ms: 900000       # 15 phút (900,000 ms)
    refresh-expiration-ms: 2592000000  # 30 ngày
  password-reset:
    expiration-ms: 600000              # 10 phút
  otp:
    expire-minutes: ${OTP_EXPIRE_MINUTES:5}
    resend-cooldown-seconds: 60
    max-sends-per-hour: 5
    max-verify-attempts: 5
  brevo:
    api-key: ${BREVO_API_KEY:}
    from-email: ${BREVO_FROM_EMAIL:}
  ws:
    internal-url: ${WS_SERVER_INTERNAL_URL:http://ws_server:3000}
    # Có thể đặt key riêng ở production; dev tạm fallback về SECRET_KEY dùng chung.
    internal-secret: ${WS_INTERNAL_SECRET:${app.jwt.secret}}
  livekit:
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    token-ttl-ms: 600000
  call:
    ring-timeout-seconds: 35
